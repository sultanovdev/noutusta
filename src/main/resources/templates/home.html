<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{home.meta.title}"></title>
    <meta name="description" th:content="#{home.meta.description}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="liquid-body">
<div th:replace="~{fragments :: navbar('/')}"></div>

<main>
    <section class="liquid-section mx-auto max-w-6xl px-4 py-10 md:py-16">
        <div class="grid gap-8 md:grid-cols-2 md:items-center">
            <div>
                <p class="liquid-badge mb-3 inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs font-semibold">
                    <span th:text="#{home.badge.city}"></span>
                    <span class="text-blue-200">•</span>
                    <span th:text="#{home.badge.days}"></span>
                </p>
                <h1 class="text-3xl font-extrabold leading-tight md:text-5xl" th:text="#{home.hero.title}"></h1>
                <p class="liquid-muted mt-4 text-base md:text-lg">
                    <span th:text="#{home.hero.description}"></span>
                </p>
                <div class="mt-5 flex flex-wrap gap-2">
                    <span class="liquid-chip rounded-full px-3 py-1 text-xs font-semibold" th:text="#{home.hero.tag1}"></span>
                    <span class="liquid-chip rounded-full px-3 py-1 text-xs font-semibold" th:text="#{home.hero.tag2}"></span>
                    <span class="liquid-chip rounded-full px-3 py-1 text-xs font-semibold" th:text="#{home.hero.tag3}"></span>
                </div>
                <div class="mt-6 flex flex-col gap-3 sm:flex-row">
                    <a th:href="@{/contact}" class="liquid-btn-primary px-5 py-3 text-center font-semibold" th:text="#{btn.contact}"></a>
                    <a th:href="@{/services}" class="liquid-btn-ghost px-5 py-3 text-center font-semibold" th:text="#{btn.services}"></a>
                </div>
            </div>
            <div class="liquid-image-frame">
                <img src="https://images.unsplash.com/photo-1587302912306-cf1ed9c33146?auto=format&fit=crop&w=900&q=75"
                     th:alt="#{home.hero.image.alt}"
                     loading="lazy"
                     class="h-full w-full object-cover">
            </div>
        </div>
    </section>

    <section class="liquid-section mx-auto max-w-6xl px-4 pb-12">
        <h2 class="text-2xl font-bold" th:text="#{home.stats.title}"></h2>
        <div class="mt-6 grid grid-cols-1 gap-3 sm:grid-cols-3">
            <article class="liquid-card rounded-2xl p-5 text-center">
                <p class="liquid-inline-link text-3xl font-extrabold">5,800+</p>
                <p class="liquid-muted mt-2 text-sm" th:text="#{home.stats.item1}"></p>
            </article>
            <article class="liquid-card rounded-2xl p-5 text-center">
                <p class="liquid-inline-link text-3xl font-extrabold" th:text="#{home.stats.value2}"></p>
                <p class="liquid-muted mt-2 text-sm" th:text="#{home.stats.item2}"></p>
            </article>
            <article class="liquid-card rounded-2xl p-5 text-center">
                <p class="liquid-inline-link text-3xl font-extrabold">10 min</p>
                <p class="liquid-muted mt-2 text-sm" th:text="#{home.stats.item3}"></p>
            </article>
        </div>
    </section>

    <section class="liquid-section mx-auto max-w-6xl px-4 pb-12">
        <h2 class="text-2xl font-bold" th:text="#{home.services.title}"></h2>
        <div class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <article class="liquid-card rounded-2xl p-5">
                <h3 class="font-semibold" th:text="#{home.services.item1.title}"></h3>
                <p class="liquid-muted mt-2 text-sm" th:text="#{home.services.item1.desc}"></p>
            </article>
            <article class="liquid-card rounded-2xl p-5">
                <h3 class="font-semibold" th:text="#{home.services.item2.title}"></h3>
                <p class="liquid-muted mt-2 text-sm" th:text="#{home.services.item2.desc}"></p>
            </article>
            <article class="liquid-card rounded-2xl p-5">
                <h3 class="font-semibold" th:text="#{home.services.item3.title}"></h3>
                <p class="liquid-muted mt-2 text-sm" th:text="#{home.services.item3.desc}"></p>
            </article>
        </div>
    </section>

    <section class="liquid-section mx-auto max-w-6xl px-4 pb-12">
        <div class="flex items-end justify-between gap-3">
            <h2 class="text-2xl font-bold" th:text="#{home.gallery.title}"></h2>
            <a href="https://www.instagram.com/noutusta/" target="_blank" rel="noopener noreferrer" class="liquid-inline-link text-sm font-semibold" th:text="#{home.gallery.link}"></a>
        </div>
        <div class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-3">
            <img class="gallery-shot h-36 w-full object-cover sm:h-44" loading="lazy" src="https://images.unsplash.com/photo-1588702547919-26089e690ecc?auto=format&fit=crop&w=700&q=75" th:alt="#{home.gallery.alt1}">
            <img class="gallery-shot h-36 w-full object-cover sm:h-44" loading="lazy" src="https://images.unsplash.com/photo-1593642532973-d31b6557fa68?auto=format&fit=crop&w=700&q=75" th:alt="#{home.gallery.alt2}">
            <img class="gallery-shot h-36 w-full object-cover sm:h-44" loading="lazy" src="https://images.unsplash.com/photo-1527443154391-507e9dc6c5cc?auto=format&fit=crop&w=700&q=75" th:alt="#{home.gallery.alt3}">
            <img class="gallery-shot h-36 w-full object-cover sm:h-44" loading="lazy" src="https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?auto=format&fit=crop&w=700&q=75" th:alt="#{home.gallery.alt4}">
            <img class="gallery-shot h-36 w-full object-cover sm:h-44" loading="lazy" src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=700&q=75" th:alt="#{home.gallery.alt5}">
            <img class="gallery-shot h-36 w-full object-cover sm:h-44" loading="lazy" src="https://images.unsplash.com/photo-1581093588401-22d65b8f8b8f?auto=format&fit=crop&w=700&q=75" th:alt="#{home.gallery.alt6}">
        </div>
    </section>

    <section class="mx-auto max-w-6xl px-4 pb-12">
        <div class="liquid-cta px-6 py-12 text-center text-white">
            <h2 class="text-2xl font-bold" th:text="#{home.cta.title}"></h2>
            <p class="liquid-muted mt-3" th:text="#{home.cta.desc}"></p>
            <a th:href="@{/contact}" class="liquid-btn-primary mt-6 inline-block px-5 py-3 font-semibold" th:text="#{btn.contact}"></a>
        </div>
    </section>
</main>

<div th:replace="~{fragments :: stickyCta}"></div>
<div th:replace="~{fragments :: chatWidget}"></div>
<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/chat.js}" defer></script>
<script th:src="@{/js/telegram-visit.js}" defer></script>
</body>
</html>
