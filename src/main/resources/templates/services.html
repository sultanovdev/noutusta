<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{services.meta.title}"></title>
    <meta name="description" th:content="#{services.meta.description}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="liquid-body">
<div th:replace="~{fragments :: navbar('/services')}"></div>

<main class="mx-auto max-w-6xl px-4 py-12">
    <h1 class="text-3xl font-extrabold" th:text="#{services.title}"></h1>
    <p class="liquid-muted mt-3 max-w-2xl" th:text="#{services.subtitle}"></p>

    <section id="categories" class="mt-8 scroll-mt-28">
        <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-end">
            <div>
                <p class="liquid-badge inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold" th:text="#{categories.badge}"></p>
                <h2 class="mt-3 text-2xl font-bold" th:text="#{categories.title}"></h2>
            </div>
            <p class="liquid-muted max-w-xl text-sm" th:text="#{categories.subtitle}"></p>
        </div>

        <div class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <a th:href="@{/categories/accessories-tech}" class="liquid-card category-card rounded-2xl p-5">
                <span class="category-icon">01</span>
                <h3 class="mt-4 font-semibold" th:text="#{category.accessories.title}"></h3>
                <p class="liquid-muted mt-2 text-sm" th:text="#{category.accessories.desc}"></p>
            </a>
            <a th:href="@{/categories/laptop-pc}" class="liquid-card category-card rounded-2xl p-5">
                <span class="category-icon">02</span>
                <h3 class="mt-4 font-semibold" th:text="#{category.laptop.title}"></h3>
                <p class="liquid-muted mt-2 text-sm" th:text="#{category.laptop.desc}"></p>
            </a>
            <a th:href="@{/categories/soft}" class="liquid-card category-card rounded-2xl p-5">
                <span class="category-icon">03</span>
                <h3 class="mt-4 font-semibold" th:text="#{category.soft.title}"></h3>
                <p class="liquid-muted mt-2 text-sm" th:text="#{category.soft.desc}"></p>
            </a>
            <a th:href="@{/categories/batteries-chargers}" class="liquid-card category-card rounded-2xl p-5">
                <span class="category-icon">04</span>
                <h3 class="mt-4 font-semibold" th:text="#{category.battery.title}"></h3>
                <p class="liquid-muted mt-2 text-sm" th:text="#{category.battery.desc}"></p>
            </a>
        </div>
    </section>

    <div class="mt-8 grid gap-5 sm:grid-cols-2">
        <article class="liquid-card rounded-2xl p-6">
            <h2 class="text-xl font-semibold" th:text="#{services.card1.title}"></h2>
            <ul class="liquid-muted mt-3 list-disc space-y-1 pl-5 text-sm">
                <li th:text="#{services.card1.item1}"></li>
                <li th:text="#{services.card1.item2}"></li>
                <li th:text="#{services.card1.item3}"></li>
                <li th:text="#{services.card1.item4}"></li>
            </ul>
        </article>
        <article class="liquid-card rounded-2xl p-6">
            <h2 class="text-xl font-semibold" th:text="#{services.card2.title}"></h2>
            <ul class="liquid-muted mt-3 list-disc space-y-1 pl-5 text-sm">
                <li th:text="#{services.card2.item1}"></li>
                <li th:text="#{services.card2.item2}"></li>
                <li th:text="#{services.card2.item3}"></li>
                <li th:text="#{services.card2.item4}"></li>
            </ul>
        </article>
        <article class="liquid-card rounded-2xl p-6">
            <h2 class="text-xl font-semibold" th:text="#{services.card3.title}"></h2>
            <ul class="liquid-muted mt-3 list-disc space-y-1 pl-5 text-sm">
                <li th:text="#{services.card3.item1}"></li>
                <li th:text="#{services.card3.item2}"></li>
                <li th:text="#{services.card3.item3}"></li>
                <li th:text="#{services.card3.item4}"></li>
            </ul>
        </article>
        <article class="liquid-card rounded-2xl p-6">
            <h2 class="text-xl font-semibold" th:text="#{services.card4.title}"></h2>
            <ul class="liquid-muted mt-3 list-disc space-y-1 pl-5 text-sm">
                <li th:text="#{services.card4.item1}"></li>
                <li th:text="#{services.card4.item2}"></li>
                <li th:text="#{services.card4.item3}"></li>
                <li th:text="#{services.card4.item4}"></li>
            </ul>
        </article>
    </div>
</main>

<div th:replace="~{fragments :: stickyCta}"></div>
<div th:replace="~{fragments :: chatWidget}"></div>
<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/chat.js}" defer></script>
<script th:src="@{/js/telegram-visit.js}" defer></script>
</body>
</html>
