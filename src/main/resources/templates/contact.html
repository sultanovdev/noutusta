<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{contact.meta.title}"></title>
    <meta name="description" th:content="#{contact.meta.description}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="liquid-body">
<div th:replace="~{fragments :: navbar('/contact')}"></div>

<main class="mx-auto max-w-6xl px-4 py-12">
    <h1 class="text-3xl font-extrabold" th:text="#{contact.title}"></h1>
    <p class="liquid-muted mt-3" th:text="#{contact.subtitle}"></p>

    <div class="mt-8 grid gap-6 md:grid-cols-2">
        <section class="liquid-card rounded-2xl p-6">
            <h2 class="text-xl font-semibold" th:text="#{contact.details.title}"></h2>
            <ul class="mt-4 space-y-3 text-sm">
                <li><strong th:text="#{contact.phone.label}"></strong> <a href="tel:+998911771299" class="liquid-inline-link">+998 91 177 12 99</a></li>
                <li><strong th:text="#{contact.telegram.label}"></strong> <a href="https://t.me/begaliyev1299" class="liquid-inline-link" data-telegram-track="true" data-telegram-source="contact_details">@begaliyev1299</a></li>
                <li><strong th:text="#{contact.address.label}"></strong> <span class="liquid-muted" th:text="#{contact.address.value}"></span></li>
                <li><strong th:text="#{contact.hours.label}"></strong> <span class="liquid-muted" th:text="#{contact.hours.value}"></span></li>
            </ul>
        </section>
        <section class="liquid-card rounded-2xl p-6">
            <h2 class="text-xl font-semibold" th:text="#{contact.before.title}"></h2>
            <ul class="liquid-muted mt-4 list-disc space-y-2 pl-5 text-sm">
                <li th:text="#{contact.before.item1}"></li>
                <li th:text="#{contact.before.item2}"></li>
                <li th:text="#{contact.before.item3}"></li>
                <li th:text="#{contact.before.item4}"></li>
            </ul>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: stickyCta}"></div>
<div th:replace="~{fragments :: chatWidget}"></div>
<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/chat.js}" defer></script>
<script th:src="@{/js/telegram-visit.js}" defer></script>
</body>
</html>
