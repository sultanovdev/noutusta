<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <title th:text="#{error.500.title}">500 · Server Error</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .content { max-width: 640px; }
    .lang-switch {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
    }
    .lang-switch a {
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 4px 8px;
      text-decoration: none;
      color: #c9d1d9;
      font-size: 12px;
    }
    .lang-switch a:hover { background-color: #21262d; border-color: #8b949e; }
    h1 {
      font-size: 96px;
      font-weight: 600;
      color: #f0f6fc;
    }
    h2 { margin-top: 10px; font-size: 24px; font-weight: 400; }
    p  { margin-top: 20px; font-size: 16px; color: #8b949e; }
    .extra-message {
      margin-top: 14px;
      color: #fda4af;
      font-size: 14px;
    }
    .actions { margin-top: 30px; }
    a.button {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid #30363d;
      border-radius: 6px;
      text-decoration: none;
      color: #c9d1d9;
      margin: 5px;
      transition: all 0.2s ease;
    }
    a.button:hover { background-color: #21262d; border-color: #8b949e; }
    .footer {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #6e7681;
    }
  </style>
</head>
<body>

<div class="lang-switch">
  <a th:href="@{/lang/{languageCode}(languageCode='uz',redirect=${requestPath != null ? requestPath : (path != null ? path : '/')})}" th:text="#{nav.lang.uz}">UZ</a>
  <a th:href="@{/lang/{languageCode}(languageCode='ru',redirect=${requestPath != null ? requestPath : (path != null ? path : '/')})}" th:text="#{nav.lang.ru}">RU</a>
  <a th:href="@{/lang/{languageCode}(languageCode='en',redirect=${requestPath != null ? requestPath : (path != null ? path : '/')})}" th:text="#{nav.lang.en}">EN</a>
</div>

<div class="container">
  <div class="content">
    <h1>500</h1>
    <h2 th:text="#{error.500.heading}">Something went wrong</h2>
    <p th:text="#{error.500.description}">
      We hit an unexpected server issue. Please try again shortly.
    </p>
    <p class="extra-message" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <div class="actions">
      <a th:href="@{/}" class="button" th:text="#{error.500.home}">Go home</a>
      <a href="javascript:history.back()" class="button" th:text="#{error.500.back}">Go back</a>
    </div>
  </div>
</div>

<div class="footer">
  © 2026 Noutusta
</div>

</body>
</html>
