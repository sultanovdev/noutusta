<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <title th:text="#{error.404.title}">404 · Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .content { max-width: 600px; }
    h1 {
      font-size: 96px;
      font-weight: 600;
      color: #f0f6fc;
    }
    h2 { margin-top: 10px; font-size: 24px; font-weight: 400; }
    p  { margin-top: 20px; font-size: 16px; color: #8b949e; }
    .actions { margin-top: 30px; }
    a.button {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid #30363d;
      border-radius: 6px;
      text-decoration: none;
      color: #c9d1d9;
      margin: 5px;
      transition: all 0.2s ease;
    }
    a.button:hover { background-color: #21262d; border-color: #8b949e; }
    .footer {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #6e7681;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="content">
    <h1>404</h1>
    <h2 th:text="#{error.404.heading}">Page not found</h2>
    <p th:text="#{error.404.description}">
      The page you are looking for might have been removed,
      had its name changed, or is temporarily unavailable.
    </p>
    <div class="actions">
      <a th:href="@{/}" class="button" th:text="#{error.404.home}">Go home</a>
      <a href="javascript:history.back()" class="button" th:text="#{error.404.back}">Go back</a>
    </div>
  </div>
</div>

<div class="footer">
  © 2026 Noutusta
</div>

</body>
</html>
