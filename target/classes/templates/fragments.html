<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="navbar(currentPath)" class="liquid-navbar-wrap px-4">
    <nav class="liquid-navbar mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-4">
        <a th:href="@{/}" class="liquid-brand" th:text="#{brand.name}"></a>
        <div class="flex items-center gap-4 text-sm">
            <a th:href="@{/}" class="liquid-nav-link" th:text="#{nav.home}"></a>
            <a th:href="@{/services}" class="liquid-nav-link" th:text="#{nav.services}"></a>
            <details class="liquid-category-menu relative">
                <summary class="liquid-nav-link cursor-pointer list-none" th:text="#{nav.categories}"></summary>
                <div class="liquid-category-dropdown">
                    <a th:href="@{/categories/accessories-tech}" class="liquid-category-link" th:text="#{category.accessories.title}"></a>
                    <a th:href="@{/categories/laptop-pc}" class="liquid-category-link" th:text="#{category.laptop.title}"></a>
                    <a th:href="@{/categories/soft}" class="liquid-category-link" th:text="#{category.soft.title}"></a>
                    <a th:href="@{/categories/batteries-chargers}" class="liquid-category-link" th:text="#{category.battery.title}"></a>
                </div>
            </details>
            <a th:href="@{/contact}" class="liquid-nav-link" th:text="#{nav.contact}"></a>
        </div>
        <div class="flex items-center gap-2 text-xs">
            <a th:href="@{/lang/{languageCode}(languageCode='uz',redirect=${currentPath})}" class="liquid-lang-switch rounded px-2 py-1" th:text="#{nav.lang.uz}"></a>
            <a th:href="@{/lang/{languageCode}(languageCode='ru',redirect=${currentPath})}" class="liquid-lang-switch rounded px-2 py-1" th:text="#{nav.lang.ru}"></a>
            <a th:href="@{/lang/{languageCode}(languageCode='en',redirect=${currentPath})}" class="liquid-lang-switch rounded px-2 py-1" th:text="#{nav.lang.en}"></a>
        </div>
    </nav>
</header>

<div th:fragment="stickyCta" class="liquid-floating-stack fixed bottom-4 left-4 z-40 flex flex-col">
    <a href="tel:+998911771299"
       class="liquid-float-btn is-call rounded-full px-5 py-3 text-sm font-semibold transition">
        +998 91 177 12 99
    </a>
    <a href="https://t.me/begaliyev1299"
       target="_blank"
       rel="noopener noreferrer"
       data-telegram-track="true"
       data-telegram-source="sticky_cta"
       class="liquid-float-btn is-telegram rounded-full px-5 py-3 text-sm font-semibold transition"
       th:text="#{btn.telegram}"></a>
</div>

<div th:fragment="chatWidget" class="pointer-events-none fixed bottom-4 right-4 z-50">
    <div id="chat-panel"
         class="chat-panel pointer-events-auto mb-3 hidden w-[92vw] max-w-sm rounded-2xl">
        <div class="chat-panel-head flex items-center justify-between rounded-t-2xl px-4 py-3 text-white">
            <p class="font-semibold" th:text="#{chat.title}"></p>
            <button id="chat-close" class="text-sm liquid-muted hover:text-white" type="button" th:text="#{chat.close}"></button>
        </div>
        <div id="chat-messages" class="h-72 space-y-3 overflow-y-auto px-4 py-3 text-sm liquid-muted"></div>
        <form id="chat-form" class="chat-form flex gap-2 p-3">
            <input id="chat-input"
                   name="message"
                   type="text"
                   maxlength="500"
                   required
                   th:placeholder="#{chat.placeholder}"
                   class="chat-input w-full rounded-lg px-3 py-2 text-sm">
            <button id="chat-submit"
                    type="submit"
                    class="chat-submit rounded-lg px-4 py-2 text-sm font-semibold"
                    th:text="#{chat.send}"></button>
        </form>
    </div>

    <button id="chat-toggle"
            type="button"
            class="chat-toggle pointer-events-auto hidden h-12 w-12 rounded-full text-xl shadow-xl transition md:h-14 md:w-14 md:text-2xl"
            th:attr="aria-label=#{chat.open},
                 data-chat-welcome-message=#{chat.welcome},
                 data-chat-loading-message=#{chat.loading},
                 data-chat-error-message=#{chat.error},
                 data-chat-fallback-message=#{chat.fallback},
                 data-chat-handoff-button=#{chat.handoff.button}">
        💬
    </button>
</div>

<footer th:fragment="footer" class="liquid-footer mt-16 px-4 py-8 text-center text-sm liquid-muted">
    <p th:text="#{footer.text}"></p>
</footer>
</body>
</html>
