spring.application.name=laptop-repair-web
spring.messages.basename=messages
spring.messages.encoding=UTF-8
server.error.include-message=never
server.error.include-binding-errors=never
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
spring.thymeleaf.cache=true
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Keep API key in environment variable OPENROUTER_API_KEY.
app.ai.api-key=${OPENROUTER_API_KEY:}
app.ai.model=${APP_AI_MODEL:gpt-4o-mini}
app.ai.url=${APP_AI_URL:https://api.openai.com/v1/chat/completions}
app.ai.timeout-ms=${APP_AI_TIMEOUT_MS:5000}
app.chat.rate-limit.max-requests=${APP_CHAT_RATE_LIMIT_MAX_REQUESTS:20}
app.chat.rate-limit.window-seconds=${APP_CHAT_RATE_LIMIT_WINDOW_SECONDS:60}

# ========== CHAT LOG ==========
app.chat-log.max-size=1000

logging.level.root=INFO
logging.level.com.noutusta.laptoprepair=INFO

